<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="980" height="420" role="img" aria-labelledby="t d">
  <title id="t">Microservices intercommunication architecture</title>
  <desc id="d">hello-client looks up hello-server in Eureka, then calls it by service name through a load-balanced RestTemplate.</desc>
  <rect width="980" height="420" fill="#07111f"/>
  <text x="32" y="38" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700">micro-services</text>
  <text x="32" y="62" fill="#7dd3fc" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Calls by Eureka service name, not by hardcoded host and port</text>

  <g font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <rect x="40" y="170" width="160" height="88" rx="12" fill="#0c2236" stroke="#38bdf8"/>
    <text x="120" y="204" fill="#e2e8f0" font-size="15" font-weight="700">Caller</text>
    <text x="120" y="226" fill="#94a3b8" font-size="12">GET /rest/hello/client</text>

    <rect x="280" y="170" width="190" height="88" rx="12" fill="#0c2236" stroke="#22d3ee"/>
    <text x="375" y="200" fill="#e2e8f0" font-size="15" font-weight="700">hello-client</text>
    <text x="375" y="220" fill="#94a3b8" font-size="12">:8072 · consumer</text>
    <text x="375" y="240" fill="#64748b" font-size="11">@LoadBalanced RestTemplate</text>

    <rect x="390" y="48" width="210" height="80" rx="12" fill="#0c2236" stroke="#fbbf24"/>
    <text x="495" y="78" fill="#e2e8f0" font-size="15" font-weight="700">eureka-service</text>
    <text x="495" y="100" fill="#94a3b8" font-size="12">:8070 · registry dashboard</text>

    <rect x="560" y="170" width="190" height="88" rx="12" fill="#0c2236" stroke="#34d399"/>
    <text x="655" y="200" fill="#e2e8f0" font-size="15" font-weight="700">hello-server</text>
    <text x="655" y="220" fill="#94a3b8" font-size="12">:8071 · provider</text>
    <text x="655" y="240" fill="#64748b" font-size="11">GET /rest/hello/server</text>

    <rect x="790" y="170" width="150" height="88" rx="12" fill="#0c2236" stroke="#38bdf8"/>
    <text x="865" y="204" fill="#e2e8f0" font-size="15" font-weight="700">Response</text>
    <text x="865" y="226" fill="#94a3b8" font-size="12">Hello-from-server</text>
  </g>

  <g stroke="#1e3a4c" stroke-width="2" fill="none">
    <path d="M200 214 H280"/>
    <path d="M470 170 V128"/>
    <path d="M375 128 H390"/>
    <path d="M600 128 H655 V170"/>
    <path d="M470 214 H560"/>
    <path d="M750 214 H790"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" fill="#94a3b8" font-size="11">
    <text x="40" y="310">1. Client asks Eureka: where is hello-server?</text>
    <text x="40" y="332">2. Registry returns the instance (localhost:8071).</text>
    <text x="40" y="354">3. Client calls http://hello-server/rest/hello/server — Ribbon resolves the virtual hostname.</text>
    <text x="40" y="388" fill="#64748b">Spring Boot 2.1.3 · Spring Cloud Greenwich.SR1 · Java 8 bytecode on JDK 11 · JUnit 4 + MockMvc.</text>
  </g>
</svg>
