<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500" role="img" aria-labelledby="title desc">
  <title id="title">Rakesh Kumar — Senior Java Backend Engineer</title>
  <desc id="desc">Dark architecture banner: client to API to Spring Boot microservices to Kafka to data stores on Docker.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="55%" stop-color="#0b1728"/>
      <stop offset="100%" stop-color="#0a1c2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="nodeFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#123047"/>
      <stop offset="100%" stop-color="#0c2236"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="48%" r="42%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .grid { opacity: 0.18; }
      .pulse { animation: pulse 3.2s ease-in-out infinite; }
      .packet { animation: flow 4.8s linear infinite; }
      .packet2 { animation: flow 4.8s linear infinite 1.6s; }
      .packet3 { animation: flow 4.8s linear infinite 3.2s; }
      @keyframes pulse {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 1; }
      }
      @keyframes flow {
        0% { offset-distance: 0%; opacity: 0; }
        8% { opacity: 1; }
        92% { opacity: 1; }
        100% { offset-distance: 100%; opacity: 0; }
      }
    </style>
  </defs>

  <rect width="1600" height="500" fill="url(#bg)"/>
  <rect width="1600" height="500" fill="url(#glow)"/>

  <g class="grid" stroke="#38bdf8" stroke-width="1" fill="none">
    <path d="M40 40 H1560 V460 H40 Z" opacity="0.35"/>
    <path d="M40 165 H620" opacity="0.25"/>
    <path d="M720 70 V430" opacity="0.12"/>
    <circle cx="1280" cy="250" r="150" opacity="0.18"/>
    <circle cx="1280" cy="250" r="220" opacity="0.1"/>
  </g>

  <text x="72" y="118" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="700">RAKESH KUMAR</text>
  <text x="72" y="164" fill="#7dd3fc" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="1.5">SENIOR JAVA BACKEND ENGINEER</text>
  <text x="72" y="214" fill="#94a3b8" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="16">Java · Spring Boot · Kafka · Microservices · Distributed Systems</text>
  <text x="72" y="268" fill="#38bdf8" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="600">Building Scalable · Secure · Distributed Systems</text>

  <g font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="72" y="310" width="118" height="34" rx="17" fill="#0f2740" stroke="#38bdf8" stroke-opacity="0.45"/>
    <text x="131" y="332" text-anchor="middle" fill="#e2e8f0" font-size="13">Java 21</text>
    <rect x="200" y="310" width="132" height="34" rx="17" fill="#0f2740" stroke="#38bdf8" stroke-opacity="0.45"/>
    <text x="266" y="332" text-anchor="middle" fill="#e2e8f0" font-size="13">Spring Boot</text>
    <rect x="342" y="310" width="92" height="34" rx="17" fill="#0f2740" stroke="#38bdf8" stroke-opacity="0.45"/>
    <text x="388" y="332" text-anchor="middle" fill="#e2e8f0" font-size="13">Kafka</text>
    <rect x="444" y="310" width="118" height="34" rx="17" fill="#0f2740" stroke="#38bdf8" stroke-opacity="0.45"/>
    <text x="503" y="332" text-anchor="middle" fill="#e2e8f0" font-size="13">JWT / RBAC</text>
  </g>

  <!-- Architecture rail -->
  <g transform="translate(700, 92)">
    <path id="flow" d="M40 160 H790" fill="none" stroke="#1e3a4c" stroke-width="3"/>
    <circle class="packet" r="5" fill="#22d3ee" filter="url(#soft)">
      <animateMotion dur="4.8s" repeatCount="indefinite" path="M40 160 H790"/>
    </circle>
    <circle class="packet2" r="4" fill="#38bdf8">
      <animateMotion dur="4.8s" begin="1.6s" repeatCount="indefinite" path="M40 160 H790"/>
    </circle>
    <circle class="packet3" r="4" fill="#67e8f9">
      <animateMotion dur="4.8s" begin="3.2s" repeatCount="indefinite" path="M40 160 H790"/>
    </circle>

    <!-- Nodes -->
    <g font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
      <rect x="10" y="118" width="110" height="84" rx="14" fill="url(#nodeFill)" stroke="#38bdf8"/>
      <text x="65" y="154" fill="#e2e8f0" font-size="14" font-weight="700">Client</text>
      <text x="65" y="176" fill="#7dd3fc" font-size="11">API caller</text>

      <rect x="150" y="118" width="110" height="84" rx="14" fill="url(#nodeFill)" stroke="#38bdf8"/>
      <text x="205" y="154" fill="#e2e8f0" font-size="14" font-weight="700">API</text>
      <text x="205" y="176" fill="#7dd3fc" font-size="11">REST</text>

      <rect x="290" y="118" width="130" height="84" rx="14" fill="url(#nodeFill)" stroke="#22d3ee"/>
      <text x="355" y="154" fill="#e2e8f0" font-size="14" font-weight="700">Spring Boot</text>
      <text x="355" y="176" fill="#7dd3fc" font-size="11">JWT · Eureka</text>

      <rect x="450" y="118" width="130" height="84" rx="14" fill="url(#nodeFill)" stroke="#38bdf8"/>
      <text x="515" y="154" fill="#e2e8f0" font-size="14" font-weight="700">Services</text>
      <text x="515" y="176" fill="#7dd3fc" font-size="11">Microservices</text>

      <rect x="610" y="118" width="110" height="84" rx="14" fill="url(#nodeFill)" stroke="#22d3ee"/>
      <text x="665" y="154" fill="#e2e8f0" font-size="14" font-weight="700">Kafka</text>
      <text x="665" y="176" fill="#7dd3fc" font-size="11">Events</text>

      <rect x="750" y="48" width="110" height="70" rx="14" fill="url(#nodeFill)" stroke="#38bdf8"/>
      <text x="805" y="80" fill="#e2e8f0" font-size="13" font-weight="700">MySQL</text>
      <text x="805" y="100" fill="#7dd3fc" font-size="11">JPA</text>

      <rect x="750" y="202" width="110" height="70" rx="14" fill="url(#nodeFill)" stroke="#38bdf8"/>
      <text x="805" y="234" fill="#e2e8f0" font-size="13" font-weight="700">Cassandra</text>
      <text x="805" y="254" fill="#7dd3fc" font-size="11">Reactive</text>

      <path d="M720 160 L750 83" stroke="#1e3a4c" stroke-width="2" fill="none"/>
      <path d="M720 160 L750 237" stroke="#1e3a4c" stroke-width="2" fill="none"/>
    </g>

    <text x="430" y="268" text-anchor="middle" fill="#64748b" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Docker · Azure · Service discovery · Role-based APIs</text>
  </g>

  <circle class="pulse" cx="1548" cy="42" r="6" fill="#22d3ee"/>
  <circle class="pulse" cx="52" cy="458" r="5" fill="#38bdf8"/>
</svg>
