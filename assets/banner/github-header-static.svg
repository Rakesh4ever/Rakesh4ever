    <rect x="200" y="310" width="132" height="34" rx="17" fill="#0f2740" stroke="#38bdf8" stroke-opacity="0.45"/>
    <text x="266" y="332" text-anchor="middle" fill="#e2e8f0" font-size="13">Spring Boot</text>
    <rect x="342" y="310" width="92" height="34" rx="17" fill="#0f2740" stroke="#38bdf8" stroke-opacity="0.45"/>
    <text x="388" y="332" text-anchor="middle" fill="#e2e8f0" font-size="13">Kafka</text>
    <rect x="444" y="310" width="118" height="34" rx="17" fill="#0f2740" stroke="#38bdf8" stroke-opacity="0.45"/>
    <text x="503" y="332" text-anchor="middle" fill="#e2e8f0" font-size="13">JWT / RBAC</text>
  </g>

