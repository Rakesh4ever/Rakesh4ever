    <text x="805" y="254" fill="#7dd3fc" font-size="11">Reactive</text>

    <path d="M720 160 L750 83" stroke="#1e3a4c" stroke-width="2" fill="none"/>
    <path d="M720 160 L750 237" stroke="#1e3a4c" stroke-width="2" fill="none"/>
    <text x="430" y="268" fill="#64748b" font-size="12">Docker · Azure · Service discovery · Role-based APIs</text>
